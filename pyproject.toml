[project]
name = "bzfig"
version = "1.0.0"
description = "Reproduction of the single-cell RNA-seq figure panels for the bradyzoite heterogeneity manuscript"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anndata>=0.11",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "scanpy>=1.10",
    "scipy>=1.14",
    "seaborn>=0.13",
]

[project.optional-dependencies]
preview = ["jinja2>=3.1", "pillow>=10.0"]
integration = ["scvi-tools>=1.4", "torch>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bzfig"]

[tool.ruff]
line-length = 100
